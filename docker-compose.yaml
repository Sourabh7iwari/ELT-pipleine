  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    networks:
      - elt_network
  
  init-airflow:
    image: apache/airflow:2.5.3
    depends_on:
      - postgres
    networks:
      - elt_network
    volumes:
      - ./init.sh:/usr/local/airflow/init.sh
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__AUTH_BACKEND: airflow.www.fab.auth.backend.DefaultAuthBackend
      AIRFLOW__FAB__AUTH_BACKENDS: airflow.providers.fab.auth_manager.api.auth.backend.basic_auth
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    entrypoint: ["bash", "/usr/local/airflow/init.sh"]

  webserver:
    build:
      context: .
      dockerfile: Dockerfile
    user: root
    depends_on:
      init-airflow:
        condition: service_completed_successfully  # Wait for DB init & user creation
    networks:
      - elt_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./elt_script:/opt/airflow/elt_script
      - ./postgres_transformations:/opt/dbt
      - ~/.dbt:/root/.dbt
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      LOAD_EX: n
      EXECUTOR: Local
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW_CONN_DESTINATION_POSTGRES: postgres://postgres:secret@destination_postgres:5434/destination_db
      AIRFLOW__CORE__FERNET_KEY: plIipb9RU3-3wJ1UNaAtqVNJrqFEks1-dGbJM34EW7U=
      AIRFLOW__WEBSERVER__DEFAULT_USER_USERNAME: airflow
      AIRFLOW__WEBSERVER__DEFAULT_USER_PASSWORD: password
      AIRFLOW_WWW_USER_USERNAME: airflow
      AIRFLOW_WWW_USER_PASSWORD: password
      AIRFLOW__WEBSERVER__SECRET_KEY: secret
    ports:
      - "8081:8080"
    command: webserver


  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    user: root
    depends_on:
      - postgres
    networks:
      - elt_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./elt:/opt/airflow/elt
      - ./custom_postgres:/opt/dbt
      - /home/sourabh7iwari/.dbt:/root/.dbt
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      LOAD_EX: n
      EXECUTOR: Local
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: zwD1Nye8TUxmY1Z4KrC_KZQZy7ozdSv0FwrVnbheo9Y=
      AIRFLOW__API__SECRET_KEY: secret
      AIRFLOW__CORE__AUTH_BACKEND: airflow.www.fab.auth.backend.DefaultAuthBackend
      AIRFLOW__FAB__AUTH_BACKENDS: airflow.providers.fab.auth_manager.api.auth.backend.basic_auth
      AIRFLOW__WEBSERVER__SECRET_KEY: secret
    command: scheduler


networks:
  elt_network:
    driver: bridge  